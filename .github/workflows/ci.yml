name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test
      - run: cargo clippy -- -D warnings
      - run: cargo check --target aarch64-unknown-linux-musl

      # Trigger bentos-distro rebuild when CI passes on push to main.
      # Requires a repository secret DISPATCH_TOKEN with contents:write scope
      # on cafe01/bentos-distro. Create at:
      #   https://github.com/cafe01/bentos-execd/settings/secrets/actions
      - name: Trigger bentos-distro rebuild
        if: github.event_name == 'push'
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cafe01/bentos-distro/dispatches \
            -d '{"event_type":"upstream-ci-success","client_payload":{"source":"bentos-execd","sha":"${{ github.sha }}"}}'
