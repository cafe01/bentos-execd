name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: bentos-execd-aarch64-musl
            rustflags: ""
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: bentos-execd-x86_64-musl
            rustflags: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler

      - name: Build static binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          cp target/${{ matrix.target }}/release/bentos-execd ${{ matrix.asset }}
          sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Verify static
        run: |
          file ${{ matrix.asset }}
          ldd ${{ matrix.asset }} 2>&1 | grep -q "not a dynamic executable"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List assets
        run: ls -lh bentos-execd-*

      - uses: softprops/action-gh-release@v2
        with:
          files: bentos-execd-*
          fail_on_unmatched_files: true
